<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Форма ИИ-компаньона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; padding: 12px; margin: 0;
         background: var(--tg-theme-bg-color, #ffffff);
         color: var(--tg-theme-text-color, #000000); }
  h2 { font-size: 18px; margin: 8px 0; }
  .hint { font-size: 12px; opacity: .7; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 13px; opacity: .85; margin-bottom: 4px; }
  input, textarea {
    width: 100%; box-sizing: border-box; padding: 9px; font-size: 14px;
    border-radius: 10px; color: inherit;
    border: 1px solid var(--tg-theme-hint-color, #999);
    background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  textarea { min-height: 100px; resize: vertical; }
  .err { border-color: #e53935; }
</style>
</head>
<body>
  <h2 id="title">Форма</h2>
  <div id="hint" class="hint"></div>
  <div id="fields"></div>
  <script src="app.js?v=2"></script>
</body>
</html>
